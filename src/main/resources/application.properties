spring.application.name=sistema-erp-sofas

spring.main.web-application-type=none
spring.main.banner-mode=off


app.db.dir=${user.home}/.sistemaerpsofas
spring.datasource.url=jdbc:sqlite:${app.db.dir}/sofas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1


spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50


logging.level.root=WARN
logging.level.pe.erp.sofas=INFO


app.seeder.enabled=true

app.auth.modo-prototipo=false
